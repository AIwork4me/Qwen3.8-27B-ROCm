# DFlash2 variant: the full baseline (configs/serve-args.conf) plus DFlash2
# block-diffusion speculative decoding. The draft checkpoint
# (incoai/Qwen3.8-27B-DFlash2, ~3.6 GiB: a 5-layer block-diffusion drafter,
# is_causal=false, sliding_window 2048) is fetched by
# SET=dflash2-bf16 scripts/02-fetch-model.sh into models/Qwen3.8-27B-DFlash2.
# Parsed (comments stripped) by scripts/03-serve-vllm.sh --dflash2;
# CI-checked by tests/test_serve_args.py.
# Keep every baseline flag in sync with serve-args.conf (only the speculative
# line differs, on purpose).
#
# Speculative-config syntax — recorded from the built tree at vLLM 4d2a68d
# (third_party/vllm):
#   "dflash" is a member of the SpeculativeConfig method union
#   (vllm/config/speculative.py:64-67, DFlashModelTypes) with a dedicated
#   worker (vllm/v1/worker/gpu/spec_decode/dflash/). Unlike "mtp", the draft
#   is a SEPARATE checkpoint: the "model" field names it (the mtp conf's
#   deliberate absence of "model" does not apply here). The path resolves
#   against the serve script's CWD (repo root). num_speculative_tokens=7 is
#   the draft repo's recommended vLLM value (HF incoai/Qwen3.8-27B-DFlash2
#   quick start, accessed via hf-mirror.com 2026-08-21).
#   NOTE: the JSON must stay compact (no spaces) — the serve script word-splits
#   each conf line, so a spaced JSON would be chopped into multiple argv
#   entries (same constraint as serve-args-mtp.conf).
--served-model-name qwen3.8-27b
--max-model-len 262144
--gpu-memory-utilization 0.92
--kv-cache-dtype auto
--attention-backend TRITON_ATTN
--dtype bfloat16
--port 8000
# Kept in lockstep with serve-args.conf (see the evidence note there).
--skip-mm-profiling
# Kept in lockstep with serve-args.conf (see the evidence note there).
--reasoning-parser qwen3
--speculative-config {"method":"dflash","model":"models/Qwen3.8-27B-DFlash2","num_speculative_tokens":7}
