# Baseline serving flags for Qwen3.8-27B BF16 (models/Qwen3.8-27B) on gfx1151
# (Strix Halo, 80 GiB unified pool). Single source of truth for serve flags,
# parsed (comments stripped) by scripts/03-serve-vllm.sh; CI-checked by
# tests/test_serve_args.py. The MTP variant is configs/serve-args-mtp.conf.
#
# Attention mechanism — flag-reality checked against the built tree at vLLM
# 4d2a68d (third_party/vllm):
#   --attention-backend is still a live CLI flag at this commit, wired from
#   AttentionConfig.backend (vllm/config/attention.py:21) via
#   vllm/engine/arg_utils.py:964. TRITON_ATTN is a member of
#   AttentionBackendEnum (vllm/v1/attention/backends/registry.py:48) and is in
#   the ROCm platform's backend priorities (vllm/platforms/rocm.py:459,
#   _get_backend_priorities; TRITON_ATTN appended at :492). NOTE: the
#   VLLM_ATTENTION_BACKEND env
#   var no longer exists at 4d2a68d (zero references under vllm/, envs.py
#   included) — the CLI flag is the only mechanism, so the env file does not
#   set it.
#   Why Triton: spike evidence (configs/spike-findings.json) — the custom
#   paged-attention path never fires for head_dim 256 on gfx1151 (rocm.py
#   gates custom kernels on head_size 64/128; this model has head_dim 256),
#   so Triton attention is the working path either way. The explicit flag
#   protects against auto-select drift toward backends that lack RDNA 3.5
#   kernels.
--served-model-name qwen3.8-27b
--max-model-len 262144
# auto == KV cache at model dtype (bf16). Attempting the full 262K context
# (max_position_embeddings) is deliberate: if boot fails at this length on the
# 80 GiB pool, that is a Task 5 finding — reduce HERE, not in the script.
--gpu-memory-utilization 0.92
--kv-cache-dtype auto
--attention-backend TRITON_ATTN
--dtype bfloat16
# Task 5's validation client expects http://127.0.0.1:8000/v1/chat/completions.
--port 8000
# Skip multimodal encoder profiling (Task 5 finding, 2026-08-17): this
# checkpoint is a Qwen3_5ForConditionalGeneration with a vision tower, so at
# boot vLLM profiles the ViT encoder with a dummy batch whose item count
# scales with max_model_len (vllm/multimodal/encoder_budget.py:168-170
# max_items_per_prompt = max_model_len // max_tokens_per_item, repeated
# per-batch in gpu_model_runner.py _get_mm_dummy_batch). At 262144 that
# profile run died with:
#   torch.OutOfMemoryError: HIP out of memory. Tried to allocate 256.00 GiB.
#   GPU 0 has a total capacity of 80.00 GiB of which 25.38 GiB is free.
# (SDPA inside the ViT encoder, profile_run -> embed_multimodal.)
# --skip-mm-profiling is the first-class upstream flag for this
# (vllm/engine/arg_utils.py:1354 -> MultiModalConfig.skip_mm_profiling,
# vllm/config/multimodal.py:217); it skips only the MM encoder + encoder-cache
# PROFILING, leaving text-path profiling and serving untouched. This stack
# validates the text path; multimodal serving is out of scope here.
--skip-mm-profiling
