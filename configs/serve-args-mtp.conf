# MTP variant: the full baseline (configs/serve-args.conf) plus native
# multi-token-prediction speculative decoding. Parsed (comments stripped) by
# scripts/03-serve-vllm.sh --mtp; CI-checked by tests/test_serve_args.py.
# Keep every baseline flag in sync with serve-args.conf (only the speculative
# line differs, on purpose).
#
# Speculative-config syntax — recorded from the built tree at vLLM 4d2a68d
# (third_party/vllm):
#   The pinned commit documents the MTP form
#     --speculative-config '{"method":"mtp","num_speculative_tokens":N}'
#   in docs/features/speculative_decoding/mtp.md (the spec_decode.md path from
#   the brief became a directory, speculative_decoding/, at this commit). The
#   "model" field is deliberately ABSENT: vllm/config/speculative.py
#   __post_init__ sets self.model = target_model_config.model when
#   method == "mtp", i.e. the MTP head loads from the BASE checkpoint — no
#   separate draft-model path is needed or wanted.
#   This checkpoint ships the head: mtp.fc.weight + mtp.layers.0.* (exactly 1
#   layer, matching text_config.mtp_num_hidden_layers = 1 in config.json).
#   speculative.py's hf_config_override maps model_type qwen3_5 ->
#   qwen3_5_mtp with n_predict = mtp_num_hidden_layers and architecture
#   Qwen3_5MTP; the class lives in vllm/model_executor/models/qwen3_5_mtp.py.
#   num_speculative_tokens = 1 matches the single shipped MTP layer exactly
#   (values > n_predict re-run the same layer and warn about a lower
#   acceptance rate in speculative.py).
#   NOTE: the JSON must stay compact (no spaces) — the serve script word-splits
#   each conf line, so a spaced JSON would be chopped into multiple argv
#   entries.
--served-model-name qwen3.8-27b
--max-model-len 262144
--gpu-memory-utilization 0.92
--kv-cache-dtype auto
--attention-backend TRITON_ATTN
--dtype bfloat16
--port 8000
# Kept in lockstep with serve-args.conf: the boot-time multimodal encoder
# profiling OOMs at large max-model-len on the 80 GiB pool (see the verbatim
# error in serve-args.conf). With profiling skipped the encoder's activation
# peak is NOT measured or reserved — image workloads put encoder-peak memory
# responsibility on the operator; re-budget before enabling image traffic
# beyond the validated single-small-image receipt case (## Vision in
# docs/results/rocm-7.14/vllm-validation.md).
--skip-mm-profiling
# In lockstep with serve-args.conf (see the evidence note there; split field
# at this pin is message."reasoning").
--reasoning-parser qwen3
--speculative-config {"method":"mtp","num_speculative_tokens":1}
