[project]
name = "qwen3-8-27b-rocm"
version = "0.1.0"
description = "Reproducible ROCm 7.14 reference for Qwen3.8-27B on AMD Radeon, gfx1151 first"
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
ci = [
    "pytest>=8",
    "shellcheck-py>=0.10",
    "actionlint-py>=1.7",
    "jsonschema>=4",
]
vllm = [
    # TheRock gfx1151 index tops out at torch 2.10.0 for cp312 (2.11.0
    # nightlies are cp314-only, verified 2026-08-16); pin the exact nightly so
    # uv.lock + resolution stay deterministic across index drift.
    "torch==2.10.0+rocm7.13.0a20260513",
    "torchvision==0.25.0+rocm7.13.0a20260513",
    "transformers>=5.8.0",
    "huggingface_hub",
    "accelerate",
]

[tool.uv]
required-version = ">=0.4"
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "therock-gfx1151"
url = "https://rocm.nightlies.amd.com/v2/gfx1151/"

[tool.uv.sources]
torch = { index = "therock-gfx1151" }
torchvision = { index = "therock-gfx1151" }

[tool.pytest.ini_options]
markers = [
    "gpu: requires a ROCm GPU on this host",
    "server: requires a running inference server",
]
addopts = "-m 'not gpu and not server'"
